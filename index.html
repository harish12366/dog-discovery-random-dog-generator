<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Discovery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🐶 Dog Discovery</h1>
        <p>Discover a different dog with every click.</p>
    </header>

    <main>
        <section class="dog-section">

            <div class="dog-card">

                <div class="image-container">
                    <p id="message">Click the button to discover a dog!</p>

                    <img
                        id="dog-image"
                        src=""
                        alt="Random dog"
                    >
                </div>

                <button id="new-dog-button" type="button">
                    🐾 Get New Dog
                </button>

            </div>

        </section>
    </main>

    <footer>
        <p>Dog Discovery • Powered by Dog CEO API</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
